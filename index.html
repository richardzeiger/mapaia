<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="As startups do Brasil com IA no centro. Mapa aberto e atualizado todo mês.">
<meta property="og:title" content="Mapa IA Brasil">
<meta property="og:description" content="As startups do Brasil com IA no centro. Mapa aberto e atualizado todo mês.">
<meta name="robots" content="noindex, nofollow">
<!-- Google Analytics (Mapa IA Brasil). Começa sem cookies; só grava cookies de medição se a pessoa aceitar no aviso. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8YGKGTQE36"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  var GA_ESCOLHA = null; try { GA_ESCOLHA = localStorage.getItem("mapaia_cookies"); } catch (e) {}
  gtag("consent", "default", {analytics_storage: GA_ESCOLHA === "sim" ? "granted" : "denied", ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied"});
  gtag("js", new Date());
  gtag("config", "G-8YGKGTQE36", {send_page_view: false});
</script>
<style>
html,body{margin:0;height:100%;background:#F4F5F9;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14151A}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
.breve{display:none;min-height:100%;box-sizing:border-box;padding:24px 16px;align-items:center;justify-content:center;text-align:center}
.breve .box{max-width:460px}
.breve h1{font-size:34px;letter-spacing:-.02em;margin:0 0 6px;display:inline-flex;align-items:flex-start;gap:6px}
.breve .beta{font-size:10px;font-weight:600;letter-spacing:.08em;color:#4B4FE0;border:1px solid #4B4FE0;border-radius:999px;padding:1px 6px;margin-top:4px}
.breve .em{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#4B4FE0;margin:22px 0 8px}
.breve p{font-size:16px;line-height:1.55;color:#5A5D6B;margin:0 0 10px}
.breve .data{font-size:20px;font-weight:600;color:#14151A;margin:0 0 22px}
.cookies{position:fixed;left:16px;right:16px;bottom:16px;z-index:10;max-width:560px;margin:0 auto;background:#14151A;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;font-size:13px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.cookies p{margin:0;flex:1}
.cookies button{font:inherit;font-weight:600;border-radius:999px;padding:7px 14px;cursor:pointer;border:1px solid #fff;flex:none}
.cookies .sim{background:#fff;color:#14151A}
.cookies .nao{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
@media (max-width:480px){.cookies{flex-wrap:wrap}.cookies p{flex-basis:100%}}
.breve .msw{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8D99;margin-top:28px}
</style>
</head>
<body>
<div class="breve" id="breve">
  <div class="box">
    <h1>Mapa IA Brasil <span class="beta">BETA</span></h1>
    <div class="em">Em breve</div>
    <p class="data">Lançamento em 15 de outubro</p>
    <p>Um mapa aberto das startups brasileiras com a inteligência artificial no centro do produto.</p>
    <div class="msw">Powered by MSW Capital</div>
  </div>
</div>
<div class="cookies" id="cookies" role="dialog" aria-label="Aviso de cookies">
  <p>Usamos cookies só para medir a audiência do mapa, sem fins de publicidade.</p>
  <button class="nao" id="ck-nao">Recusar</button>
  <button class="sim" id="ck-sim">Aceitar</button>
</div>
<iframe id="mapa" title="Mapa IA Brasil" allow="clipboard-write" hidden></iframe>
<script>
  // Quem chegar por http:// é mandado para https:// (o certificado já está ativo).
  if (location.protocol === "http:" && location.hostname !== "localhost") {
    location.replace("https://" + location.host + location.pathname + location.search + location.hash);
  }
  // O mapa roda no Google Apps Script; esta página só dá o endereço bonito.
  // O trecho depois do # (ex.: #inscricao, #lista) é repassado para o mapa.
  var APP = "https://script.google.com/macros/s/AKfycbzCH59xoY49SAhATK2SUsXg9WGAwgFmeYRtEQUPhfVg7HadsY-XMT-Hux-Mdrt0ZV40lQ/exec";

  // PRÉ-LANÇAMENTO: enquanto LANCADO for false, só vê o mapa quem abriu uma vez
  // com ?chave=CHAVE. No dia do lançamento, trocar para true.
  var LANCADO = false;
  var CHAVE = "previa1510";

  function liberado(){
    if (LANCADO) return true;
    var q = new URLSearchParams(location.search).get("chave");
    try {
      if (q === CHAVE) {
        localStorage.setItem("mapaia_chave", CHAVE);
        history.replaceState(null, "", location.pathname + location.hash);
      }
      return localStorage.getItem("mapaia_chave") === CHAVE;
    } catch (e) { return q === CHAVE; }
  }

  // Medição: o mapa (dentro do iframe do Apps Script) avisa cada aba aberta e
  // cada clique importante; aqui repassamos ao Google Analytics.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.mapaia !== "ga" || !/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    gtag("event", d.ev, d.p || {});
  });

  // Aviso de cookies: aparece só até a pessoa escolher.
  (function () {
    var box = document.getElementById("cookies");
    function escolher(v) {
      try { localStorage.setItem("mapaia_cookies", v); } catch (e) {}
      if (v === "sim") gtag("consent", "update", {analytics_storage: "granted"});
      box.style.display = "none";
    }
    if (GA_ESCOLHA !== "sim" && GA_ESCOLHA !== "nao") box.style.display = "flex";
    document.getElementById("ck-sim").onclick = function () { escolher("sim"); };
    document.getElementById("ck-nao").onclick = function () { escolher("nao"); };
  })();

  function abrir(){ document.getElementById("mapa").src = APP + (location.hash || ""); }

  if (liberado()) {
    document.getElementById("mapa").hidden = false;
    abrir();
    window.addEventListener("hashchange", abrir);
  } else {
    document.getElementById("breve").style.display = "flex";
    gtag("event", "page_view", {page_title: "Mapa IA Brasil · Em breve"});
  }
</script>
</body>
</html>
